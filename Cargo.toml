[package]
authors     = ["scttcper <scttcper@gmail.com>"]
description = "[SWC plugin] Automatically annotate React components with data attributes for component tracking"
edition     = "2024"
homepage    = "https://github.com/scttcper/swc-plugin-component-annotate"
keywords    = ["swc-plugin", "swc", "react", "jsx", "component", "tracking", "annotation"]
license     = "MIT"
name        = "swc-plugin-component-annotate"
publish     = false
readme      = "README.md"
repository  = "https://github.com/scttcper/swc-plugin-component-annotate"
version     = "1.18.0"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"], default-features = false }
serde_json = { version = "1.0.154", default-features = false }
# Lowest swc_core on the swc_ecma_ast 29 / swc_common 26 plugin ABI.
swc_core = { version = "=77.0.0", features = ["ecma_plugin_transform"] }


[dev-dependencies]
testing = "27.0.0"
swc_core = { version = "=77.0.0", features = ["ecma_plugin_transform", "ecma_parser", "swc_ecma_transforms_testing"] }

[profile.release]
codegen-units = 1
lto = true
# Optimize for transform speed over wasm size
opt-level = 3
# Strip debug symbols
strip = "symbols"

[profile.dev]
incremental = true
debug = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(swc_ast_unknown)"] }
